<script id="paginationTemplate" type="text/x-jquery-tmpl">
<div class="col-sm-12 col-md-5">
	자료가 <span class="totCnt">0</span>건 조회되었습니다.
</div>
<div class="col-sm-12 col-md-7">
	<nav class="Page navigation">
		<ul class="pagination justify-content-end">
			{{if page.totalPageCount > page.pageSize}}
				<li class="page-item">
					<a class="page-link" aria-label="First" onclick="{{= jsFunction}}({{= page.firstPageNo}});return false;">
						<span aria-hidden="true">&laquo;</span>
					</a>
				</li>
				<li class="page-item">
					<a class="page-link" aria-label="Previous" 
						onclick="{{= jsFunction}}({{= (page.firstPageNoOnPageList > page.pageSize) ? page.firstPageNoOnPageList - 1 : page.firstPageNo}});return false;">
						<span aria-hidden="true">&lt;</span>
					</a>
				</li>
			{{/if}}
			
			{{each(idx, no) getPageNumbersToArray(page.firstPageNoOnPageList, page.lastPageNoOnPageList)}}
				{{if no == page.currentPageNo}}
					<li class="page-item active"><a class="page-link" href="#header">{{= no}}</a></li>
				{{else}}
					<li class="page-item"><a class="page-link" onclick="{{= jsFunction}}({{= no}});return false;">{{= no}}</a></li>
				{{/if}}
			{{/each}}
			
			{{if page.totalPageCount > page.pageSize}}
				<li class="page-item">
					<a class="page-link" aria-label="Next" 
						onclick="{{= jsFunction}}({{= (page.lastPageNoOnPageList < page.totalPageCount) ? (page.firstPageNoOnPageList + page.pageSize) : page.lastPageNo}});return false;">
						<span aria-hidden="true">&gt;</span>
					</a>
				</li>
				<li class="page-item">
					<a class="page-link" aria-label="Last" onclick="{{= jsFunction}}({{= page.lastPageNo}});return false;">
						<span aria-hidden="true">&raquo;</span>
					</a>
				</li>
			{{/if}}
		</ul>
	</nav>
</div>
</script>
